margin:6px}.drop span{font-size:11px;color:var(--muted)}.filebtn{display:inline-flex;margin-top:13px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:120px;resize:vertical}.files{display:grid;gap:6px;margin-top:11px}.file{display:flex;align-items:center;gap:9px;padding:8px 10px;background:#f6f6f2;border-radius:8px;font-size:11px}.file .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.remove{border:0;background:transparent;color:#8a8c83;font-size:17px}.helper{font-size:10px;color:var(--muted);line-height:1.5}.urlrow{display:flex;gap:7px}.urlrow input{flex:1;min-width:0}.empty{padding:42px 20px;text-align:center;color:var(--muted)}.empty .big{font-size:28px}.empty h3{color:var(--ink);font-size:15px;margin:7px}.empty p{font-size:12px;max-width:450px;margin:0 auto}.status{font-size:11px;color:var(--muted)}.notice{margin-top:14px;background:#f7f5ec;padding:12px 14px;border-radius:9px;color:#75715f;font-size:11px}.mobile-menu{display:none}
    .quiz-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:0 0 14px}.quiz-stats .panel{padding:13px}.quiz-stats h2{font-size:20px;margin:4px 0 0}.quiz-result{margin-bottom:14px;background:#eff5ec}.attempt-card details{margin:10px 0}.attempt-card summary{cursor:pointer;font-size:12px;font-weight:700}.answer.selected{border-color:#7f9e82;background:#f0f5ed}.answer:disabled{cursor:default}.answer:disabled:hover{border-color:var(--line)}.quiz-submit-hint{flex-basis:100%;text-align:center}
    @media(max-width:900px){.app{grid-template-columns:220px minmax(0,1fr)}.dashboard-grid{grid-template-columns:1fr}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:650px){.app{display:block}.sidebar{height:auto;position:relative;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px 12px}.workspace{display:none}.nav-label,.divider,.sidebar-bottom,.page-row{display:none}.nav{display:flex;overflow:auto;gap:4px}.nav-btn{width:auto;white-space:nowrap;padding:8px 10px}.topbar{height:53px;padding:0 16px}.content{padding:25px 16px 50px}.page-head h1{font-size:24px}.page-head{margin-bottom:18px}.welcome{padding:21px}.welcome h2{font-size:21px}.cards-grid{grid-template-columns:1fr}.study-card{min-height:155px}.quick-grid{gap:8px}.panel{padding:15px}.note-card{padding:17px}.note-title{font-size:22px}.connection{display:none}.flip{min-height:245px}.flip h2{font-size:21px}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">✳</div><div><strong>Study Studio</strong><small>Your learning space</small></div></div>
    <div class="workspace"><span class="emoji">🌿</span><span>My workspace</span><span class="chev">⌄</span></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="mainNav" aria-label="Workspace pages">
      <button class="nav-btn active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
      <button class="nav-btn" data-page="notes"><span class="nav-icon">▤</span>My notes<span class="nav-count">1</span></button>
      <button class="nav-btn" data-page="library"><span class="nav-icon">▣</span>Study library</button>
      <button class="nav-btn" data-page="flashcards"><span class="nav-icon">▧</span>Flashcards</button>
      <button class="nav-btn" data-page="quiz"><span class="nav-icon">☷</span>Practice quiz</button>
      <button class="nav-btn" data-page="materials"><span class="nav-icon">⇧</span>Add materials</button>
    </nav>
    <div class="divider"></div>
    <div class="page-row"><div class="nav-label" style="margin:0;flex:1">Your pages</div><button class="add-page" id="addPage" title="Create a page">＋</button></div>
    <nav class="nav" id="customPages" aria-label="Your pages"></nav>
    <div class="sidebar-bottom"><div class="streak"><div class="streak-top"><span>Weekly study streak</span><span>✦ 3 days</span></div><p>A little practice adds up.</p><div class="days"><i class="done">M</i><i class="done">T</i><i class="done">W</i><i>T</i><i>F</i><i>S</i><i>S</i></div></div><div class="profile"><div class="avatar">S</div><div><b>Student</b><small>Keep learning 🌱</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb" id="breadcrumb">My workspace / <b>Home</b></div><div class="top-actions"><span class="connection" id="backendStatus">Library offline</span><span class="connection" id="connection">n8n not connected</span><button class="icon-btn" id="clearBtn" title="Clear current session" aria-label="Clear current session">↺</button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
  const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let chosenFiles=[],studyData=null,activePage='home',answered={},cardIndex=0,showAnswer=false,customPages=[],currentStudyId=null,currentStudyRecord=null,editingRecord=null,libraryStudies=[],quizAnswers={},quizSubmitted=false,quizResult=null,quizHistory=[],quizHistoryFor=null,quizSaving=false,quizSaveMessage='';
  const pageNames={home:'Home',notes:'My notes',library:'Study library',edit:'Edit study material',flashcards:'Flashcards',quiz:'Practice quiz',materials:'Add materials'};
  const storage={get(k){try{return localStorage.getItem(k)||''}catch{return ''}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}};
  let webhook=storage.get('studyWebhookUrl'); customPages=(()=>{try{return JSON.parse(storage.get('studyPages'))||[]}catch{return []}})();
  function setConnection(){const el=$('#connection');el.textContent=webhook?'n8n connected':'n8n not connected';el.classList.toggle('on',!!webhook)}setConnection();
  async function apiRequest(path,options={}){const init={...options,headers:{'Content-Type':'application/json',...(options.headers||{})}};const response=await fetch(path,init);const payload=response.status===204?null:await response.json().catch(()=>null);if(!response.ok)throw new Error(payload?.error||`Backend returned HTTP ${response.status}`);return payload}
  async function refreshBackendStatus(){const el=$('#backendStatus');try{await apiRequest('/api/health');el.textContent='Library ready';el.classList.add('on')}catch{el.textContent='Library offline';el.classList.remove('on')}}
  function changePage(page){activePage=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page.startsWith('custom:')&&b.dataset.custom===page.split(':')[1]));const label=pageNames[page]||(page.startsWith('custom:')?customPages[Number(page.split(':')[1])]?.title:'')||page;$('#breadcrumb').innerHTML=`My workspace / <b>${esc(label)}</b>`;renderPage()}
  $('#mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)changePage(b.dataset.page)});
  $('#customPages').addEventListener('click',e=>{const b=e.target.closest('[data-custom]');if(b)changePage('custom:'+b.dataset.custom)});
  function drawCustomPages(){ $('#customPages').innerHTML=customPages.map((p,i)=>`<button class="nav-btn" data-custom="${i}"><span class="nav-icon">${esc(p.icon||'▤')}</span>${esc(p.title)}</button>`).join(''); }
  $('#addPage').onclick=()=>{const title=prompt('Name your new page');if(!title?.trim())return;customPages.push({title:title.trim(),icon:'▤'});storage.set('studyPages',JSON.stringify(customPages));drawCustomPages();changePage('custom:'+(customPages.length-1))};drawCustomPages();
  $('#clearBtn').onclick=()=>{chosenFiles=[];studyData=null;currentStudyId=null;currentStudyRecord=null;answered={};quizAnswers={};quizSubmitted=false;quizResult=null;quizHistory=[];quizHistoryFor=null;storage.set('scratchNote','');updateFiles();if($('#notesInput'))$('#notesInput').value='';if($('#goal'))$('#goal').value='';if($('#questionCount'))$('#questionCount').value='5';renderPage()};
  function pageHead(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="overline">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
  function renderPage(){const root=$('#content');if(activePage.startsWith('custom:')){const p=customPages[Number(activePage.split(':')[1])];if(!p)return;root.innerHTML=pageHead('Your page',esc(p.title),'A fresh page for your learning ideas.')+`<section class="panel note-card"><textarea class="edit-area" placeholder="Start writing…">${esc(p.body||'')}</textarea><p class="helper">Your page content is saved in this browser.</p></section>`;root.querySelector('textarea').oninput=e=>{p.body=e.target.value;storage.set('studyPages',JSON.stringify(customPages))};return}
    if(activePage==='library'){renderLibrary();return}
    if(activePage==='edit'){renderStudyEditor();return}

  function updateFiles(){const box=$('#files');if(!box)return;box.innerHTML=chosenFiles.map((f,i)=>`<div class="file"><span>📄</span><span class="name" title="${esc(f.name)}">${esc(f.name)}</span><small>${(f.size/1024).toFixed(0)} KB</small><button class="remove" data-remove="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}
  function wireMaterials(){const storageUrl=$('#webhook');$('#saveUrl').onclick=()=>{webhook=storageUrl.value.trim();storage.set('studyWebhookUrl',webhook);setConnection();$('#status').textContent=webhook?'Webhook URL saved in this browser':'Add your n8n webhook URL'};storageUrl.oninput=()=>{webhook=storageUrl.value.trim();setConnection()};$('#fileInput').onchange=e=>{for(const f of e.target.files)if(!chosenFiles.some(x=>x.name===f.name&&x.size===f.size))chosenFiles.push(f);updateFiles();e.target.value=''};$('#files').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){chosenFiles.splice(+b.dataset.remove,1);updateFiles()}};const drop=$('#drop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>{for(const f of e.dataTransfer.files)if(!chosenFiles.some(x=>x.name===f.name&&x.size===f.size))chosenFiles.push(f);updateFiles()});$('#notesInput').oninput=e=>storage.set('scratchNote',e.target.value);$('#analyzeBtn').onclick=analyze}
  async function analyze(){const url=$('#webhook').value.trim(),notes=$('#notesInput').value.trim(),goal=$('#goal').value.trim(),questionCount=Number($('#questionCount').value);if(!url){$('#status').textContent='Add your n8n webhook URL first';$('#webhook').focus();return}if(!/^https?:\/\//i.test(url)){ $('#status').textContent='Enter a valid http or https webhook URL';$('#webhook').focus();return }if(!Number.isInteger(questionCount)||questionCount<1||questionCount>50){$('#status').textContent='Choose between 1 and 50 quiz questions.';$('#questionCount').focus();return}if(chosenFiles.some(f=>!/\.(pdf|txt|md|csv)$/i.test(f.name))){$('#status').textContent='This workflow supports PDF, TXT, Markdown, and CSV files.';return}if(!chosenFiles.length&&!notes){$('#status').textContent='Add notes or at least one file';return}const btn=$('#analyzeBtn');btn.disabled=true;btn.textContent='Sending to n8n…';$('#status').textContent='Preparing files and waiting for n8n';const fd=new FormData();chosenFiles.forEach(f=>fd.append('files',f,f.name));fd.append('notes',notes);fd.append('goal',goal);fd.append('questionCount',String(questionCount));fd.append('action','analyze');fd.append('responseFormat','study-material-v1');const textFiles=await Promise.all(chosenFiles.filter(f=>/\.(txt|md|csv)$/i.test(f.name)).map(async f=>`\n\n--- ${f.name} ---\n${await f.text()}`));if(textFiles.length)fd.set('notes',[notes,...textFiles].filter(Boolean).join('\n'));try{const r=await fetch(url,{method:'POST',body:fd});if(!r.ok)throw new Error(`n8n returned HTTP ${r.status}`);let payload=JSON.parse(await r.text());if(Array.isArray(payload)&&payload.length===1)payload=payload[0]?.json??payload[0];if(payload&&typeof payload==='object')for(const key of ['data','output','result'])if(payload[key]!==undefined){payload=payload[key];break}if(typeof payload==='string')payload=JSON.parse(payload);if(!payload||typeof payload!=='object'||Array.isArray(payload))throw new Error('The webhook returned an unexpected response. Return a JSON study pack object.');studyData=payload;answered={};cardIndex=0;showAnswer=false;try{const sourceName=chosenFiles.map(f=>f.name).join(', ')||'Pasted notes';await saveStudyPack(studyData,sourceName);$('#status').textContent='Study pack created and saved to your library!'}catch(saveErr){currentStudyId=null;currentStudyRecord=null;$('#status').textContent=`Study pack created but could not be saved: ${saveErr.message}`}changePage('notes')}catch(err){$('#status').textContent=`Could not complete analysis: ${err.message}`}finally{btn.disabled=false;btn.textContent='✨ Create my study pack'}}
  renderPage();refreshBackendStatus();
</script>
